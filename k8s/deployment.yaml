apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome-fleet
  labels:
    app.kubernetes.io/name: esphome-fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: esphome-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: esphome-fleet
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: esphome-fleet
          image: ghcr.io/weirded/esphome-dist-client:1.7.0
          imagePullPolicy: IfNotPresent
          env:
            # App secret (created separately; not committed)
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: esphome-fleet-secret
                  key: server_url
                  optional: false
            - name: SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: esphome-fleet-secret
                  key: server_token
                  optional: false
            - name: MAX_PARALELL_JOBS
              value: "4"
            - name: ESPHOME_SEED_VERSION
              value: "2026.4.4"

          volumeMounts:
            - name: esphome-fleet-worker
              mountPath: /esphome-versions

      volumes:
        - name: esphome-fleet-worker
          persistentVolumeClaim:
            claimName: esphome-fleet-worker-pvc